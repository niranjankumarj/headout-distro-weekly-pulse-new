name: Distro Weekly Pulse

on:
  schedule:
    # Monday 2:00 PM IST = Monday 8:30 AM UTC
    - cron: "30 8 * * 1"

  workflow_dispatch:

jobs:
  weekly-pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "OMNI_API_TOKEN=${{ secrets.OMNI_API_TOKEN }}" >> .env
          echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" >> .env
          echo "SLACK_DM_CHANNEL=${{ secrets.SLACK_DM_CHANNEL }}" >> .env

      - name: Verify Secrets
        run: |
          echo "=============================="
          echo "Verifying GitHub Secrets"
          echo "=============================="
          echo "OMNI_API_TOKEN exists: ${{ secrets.OMNI_API_TOKEN != '' }}"
          echo "SLACK_BOT_TOKEN exists: ${{ secrets.SLACK_BOT_TOKEN != '' }}"
          echo "SLACK_DM_CHANNEL exists: ${{ secrets.SLACK_DM_CHANNEL != '' }}"

      - name: Run Weekly Pulse
        run: |
          python src/main.py